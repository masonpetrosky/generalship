[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "generalship"
version = "0.2.0"
description = "Evidence-first historical command research and reproducible battle baselines"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
Homepage = "https://masonpetrosky.github.io/generalship/"
Repository = "https://github.com/masonpetrosky/generalship"

[project.scripts]
generalship = "generalship.cli:main"

[tool.setuptools]
packages = ["generalship"]
